# soccer_cfg.yaml
# Configuração final e estável para o ambiente de visualização 'Soccer'.
# Baseado no arquivo de treinamento T1 para garantir compatibilidade total.

basic:
  headless: false
  sim_device: "cuda:0"
  rl_device: "cuda:0"
  seed: 42
  description: "Configuração de visualização para o ambiente Soccer."

env:
  num_envs: 16
  env_spacing: 5.0
  # Flag para posições iniciais (default: False = centro do campo)
  randomize_init_pos: False 

  # Ganhos do controlador PD para manter o robô em pé
  pd_gains:
    kp: 80.0  # Ganho Proporcional (P)
    kd: 1.2   # Ganho Derivativo (D)
  
  stand_pose_file: "deploy/models/T1.pt"

camera:
  link_name: "H2"
  hfov_real_deg: 87.0
  vfov_real_deg: 58.0

control:
  action_scale: 1.0

viewer:
  pos: [5., -5., 4.]  # Posição da câmera para ver o campo
  lookat: [2., 0., 1.] # Olhando para o centro da ação
  record_video: false

sim:
  # Parâmetros de simulação copiados do arquivo original para garantir estabilidade
  dt: 0.002
  substeps: 1
  up_axis: "z"
  gravity: [0.0, 0.0, -9.81]
  physics_engine: "physx"
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608
    num_subscenes: 4
    contact_collection: 1

asset:  
  # !!! VERIFIQUE SE ESTE CAMINHO ESTÁ CORRETO PARA O SEU PROJETO !!!
  file: "resources/T1/T1_locomotion.urdf"

  name: "T1"
  disable_gravity: false
  collapse_fixed_joints: false
  fix_base_link: false
  self_collisions: 0 # 0 para habilitar
  flip_visual_attachments: false 

  # Parâmetros físicos do asset para estabilidade
  density: 0.001
  angular_damping: 0.
  linear_damping: 0.
  max_angular_velocity: 1000.
  max_linear_velocity: 1000.
  armature: 0.
  thickness: 0.01

init_state:
  # Posição inicial segura para evitar colisão no primeiro frame
  pos: [0.0, 0.0, 0.8] # x,y,z [m]
  rot: [0.0, 0.0, 0.0, 1.0] # x,y,z,w [quat]
  lin_vel: [0.0, 0.0, 0.0]
  ang_vel: [0.0, 0.0, 0.0]
  default_joint_angles: {"default": 0.}

terrain:
  # Terreno plano simples para o campo de futebol
  type: "plane"
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.

normalization:
  gravity: 1.0
  lin_vel: 1.0
  ang_vel: 1.0
  dof_pos: 1.0
  dof_vel: 0.1
  filter_weight: 0.1
  push_force: 0.1
  push_torque: 0.5
  clip_actions: 1.

control:
  stiffness: {"Hip": 200., "Knee": 200., "Ankle": 50.} # [N*m/rad]
  damping: {"Hip": 5., "Knee": 5., "Ankle": 1.} # [N*m*s/rad]
  action_scale: 1.
  decimation: 10

# As seções a seguir foram removidas por não serem necessárias para a visualização:
# - runner
# - algorithm
# - control
# - noise
# - randomization
# - rewards